readme = "README.md"
requires-python = ">= 3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Multimedia",
]

[project.scripts]
bcgpt = "bcgpt:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "docker~=7.1.0",
    "pytest>=9.0.3,<10",
    "moto[s3]>=5.0.26",
]

[tool.rye]
managed = true
dev-dependencies = []

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
path = "package.json"
pattern = '"version":\s*"(?P<version>[^"]+)"'

[tool.hatch.build.hooks.custom]  # keep this for reading hooks from `hatch_build.py`

[tool.hatch.build.targets.wheel]
sources = ["backend"]
exclude = [
    ".dockerignore",
    ".gitignore",
    ".bcgpt_secret_key",
    "dev.sh",
    "requirements.txt",
    "start.sh",
    "start_windows.bat",
    "bcgpt.db",
]
force-include = { "CHANGELOG.md" = "bcgpt/CHANGELOG.md", build = "bcgpt/frontend" }

[tool.codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = '.git*,*.svg,package-lock.json,i18n,*.lock,*.css,*-bundle.js,locales,example-doc.txt,emoji-shortcodes.json'
check-hidden = true
# ignore-regex = ''
ignore-words-list = 'ans'

# Enables `python -m pytest backend/bcgpt/test/unit` from repo root.
# Canonical command remains `make test-backend-unit` (see Makefile).
# Fixes the ModuleNotFoundError documented in PRODUCTION_HARDENING_LOG Iteration 3.
[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/bcgpt/test/unit"]
addopts = "-q"
