# BCGPT WebUI with PostgreSQL + Redis (Production)
# Usage: docker compose -f docker-compose.with-db.yml up -d
#
# Production deployment with external database and cache.
# POSTGRES_PASSWORD must be set before deploying!

services:
  bcgpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcgpt
    ports:
      - "8090:8090"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-bcgpt}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}@postgres:5432/${POSTGRES_DB:-bcgpt}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BCGPT_SECRET_KEY=${BCGPT_SECRET_KEY:-}
      - BCGPT_SESSION_COOKIE_SECURE=true
    volumes:
      - bcgpt-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=100m,noexec
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  postgres:
    image: postgres:16-alpine
    container_name: bcgpt-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bcgpt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}
      - POSTGRES_DB=${POSTGRES_DB:-bcgpt}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bcgpt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    # Do not expose PostgreSQL to host in production
    # Uncomment only for debugging:
    # ports:
    #   - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: bcgpt-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    # Do not expose Redis to host in production
    # Uncomment only for debugging:
    # ports:
    #   - "6379:6379"

volumes:
  bcgpt-data:
    name: bcgpt-data
  postgres-data:
    name: bcgpt-postgres-data
  redis-data:
    name: bcgpt-redis-data
