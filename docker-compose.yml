# BCGPT WebUI with Ollama (All-in-One)
# Usage: docker compose up -d

services:
  bcgpt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bcgpt
    ports:
      - "8090:8090"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - BCGPT_SECRET_KEY=${BCGPT_SECRET_KEY:-}
    volumes:
      - bcgpt-data:/app/backend/data
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=100m,noexec
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  ollama:
    image: ollama/ollama:0.6.5
    container_name: ollama
    volumes:
      - ollama-data:/root/.ollama
    # Uncomment to expose Ollama API on host
    # ports:
    #   - "11434:11434"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '1'
          memory: 2G
    # Uncomment for GPU support (requires Nvidia Container Toolkit)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  bcgpt-data:
    name: bcgpt-data
  ollama-data:
    name: ollama-data
